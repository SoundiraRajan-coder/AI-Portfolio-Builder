{% set v = module.variant %}<section id="certifications" class="composition-section certifications-component certifications-component-{{ v }}"><div class="section-header"><p class="section-kicker">Credentials &amp; Honors</p><h2>Certifications</h2></div><div class="certifications-grid">{% for item in c.certifications %}<div class="certification-card"><div class="cert-icon">📜</div><div class="cert-body"><h3>{{ item.name }}</h3>{% if item.issuing_organization %}<p class="cert-issuer">Issued by <strong>{{ item.issuing_organization }}</strong></p>{% endif %}{% if item.credential_url %}<a class="cert-link" href="{{ item.credential_url }}" target="_blank" rel="noopener noreferrer">View Certificate ↗</a>{% endif %}</div></div>{% endfor %}</div></section>
